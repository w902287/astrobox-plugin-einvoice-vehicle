[package]
name = "astrobox-plugin-einvoice-single"
version = "1.4.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.47.0", features = ["async", "async-spawn"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
png = "0.17"
fontdue = "0.9"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
